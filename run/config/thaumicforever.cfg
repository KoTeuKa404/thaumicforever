# Configuration file

aura {
    # Experimental. If true, ordinary Thaumcraft vis is controlled by nearby Thaumic Forever aura nodes instead of being freely refilled by primal aura. [default: false]
    B:"Enable Node Bound Thaumcraft Aura"=false

    # If true, primal aura can refill ordinary Thaumcraft vis. Conversion stops when any primal aspect is below 40% of its base. [default: true]
    B:"Enable Primal Aura To Vis Conversion"=true

    # Maximum ordinary Thaumcraft vis drained per processed chunk when no aura node supports that chunk. [range: 0.0 ~ 20.0, default: 0.5]
    S:"Node Bound Thaumcraft Aura No Node Drain"=0.5

    # How many chunks from each aura node can receive ordinary Thaumcraft vis in node-bound aura mode. [range: 1 ~ 16, default: 4]
    I:"Node Bound Thaumcraft Aura Radius Chunks"=4

    # Target ordinary Thaumcraft vis added per node strength point in node-bound aura mode. [range: 1.0 ~ 100.0, default: 18.0]
    S:"Node Bound Thaumcraft Aura Vis Per Strength"=18.0
}


coremod {
    B:enableSealStockInTransitPatch=true
}


debug {
    # Output filename (relative to config folder) for the aspect dump. [default: aspect_dump.txt]
    S:"Aspect Dump File"=aspect_dump.txt

    # If true, writes a list of all item stacks and their aspects to a file at load complete. [default: false]
    B:"Enable Aspect Dump"=false

    # If true, logs crucible recipe owners and overrides at load complete. [default: false]
    B:"Enable Crucible Debug"=false
}


foci {
    # Complexity (cost) for focus_4 (Focus Max). [range: 1 ~ 1000, default: 80]
    I:"Focus4 Complexity"=80

    # Complexity  for focus_5 (Focus Ultimate). [range: 1 ~ 1000, default: 120]
    I:"Focus5 Complexity"=120
}


general {
    # If true, Ancient ores will be generated. [default: true]
    B:"Enable Ancient Ore Generation"=true

    # If true, Aquareia ore will be generated. [default: true]
    B:"Enable Aquareia Ore Generation"=true

    # If true, enables funny staff to be added to the mod. [default: true]
    B:"Enable Funny Staff"=true

    # If true, Silk Touch will drop correct iron/gold ore when industrialupgrade breaks it. [default: false]
    B:"Enable Silk Touch Fix"=false

    # If false, Thaumic Forever will not register Copper, Tin, Lead and Silver ores, ingots, storage blocks, item forms, ore dictionary entries, smelting recipes, crafting recipes or world generation. Disable this only before creating/loading worlds that should not contain these blocks/items. [default: true]
    B:"Enable Standard Ore Generation"=true

    # If true, the ThaumicEventHandler will remove event with mini stone (garden of glass). [default: false]
    B:"Enable Thaumic Event Handler"=false

    # If true, the Thaumic House structure will spawn in the Magical Forest biome. [default: true]
    B:"Enable Thaumic House Generation"=true

    # If true, the mechanismComplex recipe will be enabled. [default: true]
    B:"Enable mechanismComplex Recipe"=true

    # List of researches that can be added dynamically. [default: ]
    S:"Research List" <
     >

    # Chance per chunk for a Thaumic House: 1 in N. [range: 1 ~ 2147483647, default: 300]
    I:"Thaumic House Spawn Chance"=10
    I:aspectTotalCap=10000
    B:instantScans=false
    B:inventoryScanning=true
    I:notificationDelay=2000
    I:notificationMax=10
    I:researchDifficulty=1
    I:researchNoteAspectLimit=22
}


integration {
    # If false, disables the embedded Old Research mod. [default: true]
    B:"Enable Old Research"=true

    # If true, removes Thaumcraft observation/theory requirements and uses OldResearch notes only. [default: false]
    B:"Enable Old Research Only"=true

    # Extra plants allowed in vanilla flower pot via ThaumicForever handler. Format: modid:block or modid:block@meta [default: [thaumicforever:red_rose], [thaumicforever:blue_rose], [thaumcraft:sapling_silverwood], [thaumcraft:sapling_greatwood], [thaumcraft:shimmerleaf], [thaumcraft:cinderpearl], [thaumcraft:vishroom]]
    S:"Vanilla Flower Pot Allowed Plants" <
        thaumicforever:red_rose
        thaumicforever:blue_rose
        thaumcraft:sapling_silverwood
        thaumcraft:sapling_greatwood
        thaumcraft:shimmerleaf
        thaumcraft:cinderpearl
        thaumcraft:vishroom
     >
}


"jef trader" {
    S:"Trade Items" <
     >
}


maze {
    # Chance Maze(in Taiga) spawn. [range: 1 ~ 1000, default: 450]
    I:"Maze Chance"=450

    # Maximum number of maze skeletons alive at the same time in one labyrinth. [range: 1 ~ 5000, default: 80]
    I:"Maze Max Alive Skeletons Per Labyrinth"=80

    # Hard cap of total maze skeleton spawns per labyrinth. 0 disables the cap. [range: 0 ~ 500000, default: 100]
    I:"Maze Max Total Skeleton Spawns Per Labyrinth"=100
}


"mystic slots" {
    # Mappings CATEGORY=BaubleType for slots unlocked at 100% research [default: [BASICS=HEAD], [ALCHEMY=BELT], [AUROMANCY=AMULET], [ARTIFICE=BODY], [INFUSION=RING], [GOLEMANCY=RING], [ELDRITCH=CHARM]]
    S:"Category Slots" <
        BASICS=HEAD
        ALCHEMY=BELT
        AUROMANCY=AMULET
        ARTIFICE=BODY
        INFUSION=RING
        GOLEMANCY=RING
        ELDRITCH=CHARM
     >

    # If false, hides the Mystic slots toggle button from inventory GUIs and blocks opening the Mystic GUI through that button. [default: true]
    B:"Enable Mystic GUI Button"=true

    # BaubleTypes unlocked immediately on first join [default: [RING], [RING]]
    S:"Immediate Slots" <
        RING
        RING
     >
}


nodes {
    # Natural aura node generation chance per chunk: 1 in N. Thaumcraft 5 default was 33. [range: 1 ~ 2147483647, default: 33]
    I:"Aura Node Rarity"=33

    # Weighted chance for hungry aura nodes. [range: 0.0 ~ 10000.0, default: 1.12]
    S:"Hungry Node Weight"=1.12

    # Multiplier applied to Pure Node Weight when a natural aura node generates in thaumcraft:magical_forest. [range: 0.0 ~ 10000.0, default: 4.0]
    S:"Magical Forest Pure Node Weight Multiplier"=4.0

    # Weighted chance for normal aura nodes. Weights are relative to the other node type weights. [range: 0.0 ~ 10000.0, default: 85.7]
    S:"Normal Node Weight"=85.7

    # Weighted chance for pure aura nodes. [range: 0.0 ~ 10000.0, default: 4.34]
    S:"Pure Node Weight"=4.34

    # If true, sinister nodes convert nearby biome to Eerie over time. [default: true]
    B:"Sinister Node Spreads Eerie Biome"=true

    # Weighted chance for sinister aura nodes. [range: 0.0 ~ 10000.0, default: 3.94]
    S:"Sinister Node Weight"=3.94

    # Weighted chance for taint aura nodes outside tainted biomes. Tainted biomes still force taint nodes. [range: 0.0 ~ 10000.0, default: 1.56]
    S:"Taint Node Weight"=1.56

    # Weighted chance for unstable aura nodes. [range: 0.0 ~ 10000.0, default: 3.34]
    S:"Unstable Node Weight"=3.34
}


"void trader" {
    # Maximum number of Overworld days before the Void Trader can spawn again. [range: 1 ~ 2147483647, default: 90]
    I:"Maximum Spawn Days"=90

    # Minimum number of Overworld days before the Void Trader can spawn again. [range: 1 ~ 2147483647, default: 20]
    I:"Minimum Spawn Days"=20

    # If true, announce in chat when a new Void Trader appears. [default: true]
    B:"Notify Void Trader Spawn"=true

    # Additional items Void Traider may offer alongside his fixed trade list. Format: modid:item, modid:item@meta, modid:item@meta*count or thaumicforever:knowledge_epiphany{RESEARCH_KEY}. [default: ]
    S:"Trade Items" <
     >
}


"wand compat" {
    # Preferred ichor cloth item for Ichor rod recipes. Format: modid:item@meta (meta optional). [default: thaumictinkerer:kamiresource@4]
    S:"Ichor Cloth Item"=thaumictinkerer:kamiresource@4

    # Preferred ichor nugget item for Ichor cap recipes. Format: modid:item@meta (meta optional). [default: thaumictinkerer:kamiresource@5]
    S:"Ichor Nugget Item"=thaumictinkerer:kamiresource@3
}


world {
    # If true, hostile mobs can also spawn during daytime in Eerie biome. [default: true]
    B:"Enable Eerie Day Mob Spawns"=true
}


worldgen {
    # Chance per chunk for a Hilltop Stones(default  40): 1 in N. [range: 1 ~ 2147483647, default: 40]
    I:"Hilltop Stones Spawn Chance"=40

    # Chance per chunk for a Obsidian Totem(default 300): 1 in N. [range: 1 ~ 2147483647, default: 300]
    I:"Obsidian Totem Spawn Chance"=300
}


